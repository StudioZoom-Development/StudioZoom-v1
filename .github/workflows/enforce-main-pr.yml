name: Enforce Main PR Source

on:
  pull_request:
    branches: [ main ]

jobs:
  check-source-branch:
    name: Check PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR head is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs targeting main MUST originate from the 'dev' branch. Head branch '${{ github.head_ref }}' is forbidden."
            exit 1
          fi
          echo "PR source branch '${{ github.head_ref }}' is valid (dev)."
